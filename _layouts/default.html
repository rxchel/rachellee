<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | Rachel Lee
    {% else %}
      Rachel Lee
    {% endif %}
  </title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 30px;
      line-height: 1.6;
      color: #222;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 0;
      border-bottom: 1px solid #ddd;
      margin-bottom: 50px;
    }

    .site-title {
      font-size: 1.3rem;
      font-weight: 600;
      text-decoration: none;
      color: #222;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: #555;
    }

    .nav-links a:hover {
      color: #1677ff;
    }

    main {
      padding-bottom: 60px;
    }

    a {
      color: #1677ff;
    }

    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <nav>
    <a class="site-title" href="{{ site.baseurl }}/">
      Rachel Lee
    </a>

    <div class="nav-links">
      <a href="{{ site.baseurl }}/">About Me</a>
      <a href="{{ site.baseurl }}/experiences/">Experiences</a>
      <a href="{{ site.baseurl }}/research/">Research</a>
      <a href="{{ site.baseurl }}/projects/">Projects</a>
      <a href="{{ site.baseurl }}/other/">Other</a> 
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

</body>
</html>
